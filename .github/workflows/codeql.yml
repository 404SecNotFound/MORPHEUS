# CodeQL static analysis.
#
# This is the advanced (workflow-file) setup rather than GitHub's default
# setup. The two conflict: if default setup is ever enabled for this
# repository in the Security settings, it must be turned off or this workflow
# will error. Advanced setup is used here because it allows pinning the action
# to a SHA and selecting the security-extended query suite, neither of which
# default setup exposes.
#
# NOTE ON VISIBILITY: code scanning is free on public repositories. On a
# private repository it requires GitHub Advanced Security; without it the
# analysis runs correctly and then fails at the upload step with "Code scanning
# is not enabled for this repository" (GitHub returns 422 "Advanced security
# has not been purchased" if you try to enable it).
#
# So the analysis is gated on the repository being public. It skips while
# private and starts by itself the moment visibility changes — no code change
# needed at the switch. A permanently-red check is not harmless: this project
# already had CI sit red on macOS and Windows for four consecutive pushes
# because a familiar red X stopped being read.
#
# Visibility is resolved through the API rather than `github.event.repository`,
# because the scheduled-event payload is not a reliable place to read it.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published query catches an old commit. Deliberately
    # off the hour: scheduled jobs on the hour queue behind everyone else's.
    - cron: "27 3 * * 1"

permissions:
  contents: read

jobs:
  visibility:
    name: Check repository visibility
    runs-on: ubuntu-latest
    outputs:
      public: ${{ steps.check.outputs.public }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          private=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)
          if [ "${private}" = "false" ]; then
            echo "public=true" >> "${GITHUB_OUTPUT}"
            echo "Repository is public: running CodeQL."
          else
            echo "public=false" >> "${GITHUB_OUTPUT}"
            echo "Repository is private: skipping CodeQL, which cannot upload"
            echo "results without GitHub Advanced Security. This job will run"
            echo "automatically once the repository is made public."
          fi

  analyze:
    name: Analyze Python
    needs: visibility
    if: needs.visibility.outputs.public == 'true'
    runs-on: ubuntu-latest
    permissions:
      # Required to upload results to the Security tab.
      security-events: write
      # Required by the action to read workflow run status on private repos.
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: python
          # security-extended over the default suite. This is a cryptographic
          # tool, so the extra precision-adjusted security queries are worth
          # the additional run time and the occasional false positive.
          queries: security-extended

      # No autobuild step: Python is interpreted, so CodeQL analyses the
      # sources directly. Adding autobuild here would be a no-op at best.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.37.3
        with:
          category: "/language:python"
