name: Release

# Publishing is driven by a tag, and the distributions are built once and reused
# by every downstream job, so what gets tested is the artefact that gets
# published rather than a second build of the same source.
#
# Authentication is PyPI Trusted Publishing (OIDC). There is no API token in
# this repository, in an environment variable, or on anyone's laptop -- GitHub
# mints a short-lived identity token per run and PyPI verifies it against the
# publisher configured for this repository. That was the sole objection recorded
# against publishing (`tasks/founder-decisions-2026-07-29.md`): a long-lived
# token on a laptop. It went away when the repo went public and Actions started
# working, because OIDC needs both.
#
# Setup this expects on the PyPI side, once, by hand:
#   PyPI -> Publishing -> Add a pending publisher
#     PyPI project name: morpheus-crypt
#     Owner:             404SecNotFound
#     Repository:        Morpheus
#     Workflow name:     release.yml
#     Environment:       pypi
# "Pending publisher" is the form to use while the project does not exist yet;
# the first successful upload creates it and converts the entry.

on:
  push:
    tags: ["v*"]
  # Dry runs to TestPyPI without cutting a real tag.
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, none]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip build twine
          pip install -e ".[dev]"
          pip install -e ".[pq]"

      # A release must not be the first time the suite runs against this tree.
      # CI covers every push, but a tag can point at any commit, so this pins
      # the tested tree to the published one.
      - name: Run the full test suite
        run: python -m pytest tests/ -q

      - name: Build sdist and wheel
        run: |
          rm -rf dist build
          python -m build

      # The tag is the release's only claim about which version this is, and
      # nothing else checks it. A `v2.1.1` tag on a tree that still says 2.1.0
      # would otherwise publish 2.1.0 under a tag that says otherwise, and PyPI
      # versions are immutable once uploaded.
      - name: Check the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          built=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=${tag} pyproject=${built}"
          if [ "$tag" != "$built" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject version ${built}"
            exit 1
          fi
          ls dist/ | grep -q "morpheus_crypt-${built}-py3-none-any.whl" \
            || { echo "::error::no wheel for ${built} in dist/"; exit 1; }

      # The same assertions the CI build job makes, applied to the artefact that
      # is about to be published rather than to a throwaway build.
      - name: Verify the distributions
        run: |
          set -euo pipefail
          twine check dist/*
          python - <<'PY'
          import glob, sys, tarfile, zipfile

          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()

          required = [
              "morpheus_crypt/py.typed",
              "morpheus_crypt/ui/app.py",
              "morpheus_crypt/ui/steps/input.py",
              "morpheus_crypt/core/pipeline.py",
          ]
          missing = [r for r in required if not any(r in n for n in names)]
          if missing:
              sys.exit(f"missing from {whl}: {missing}")

          # The whole point of the rename: this distribution must never occupy
          # the top-level `morpheus` name, which belongs to an unrelated
          # project on PyPI. `morpheus.py` is the repo-root launcher and must
          # not be smuggled into the wheel as a module either.
          strays = [n for n in names
                    if n.startswith("morpheus/") or n == "morpheus.py"]
          if strays:
              sys.exit(f"{whl} would collide with the PyPI 'morpheus' package: {strays}")

          sdist = glob.glob("dist/*.tar.gz")[0]
          with tarfile.open(sdist) as tf:
              members = tf.getnames()
          if not any("morpheus_crypt/core/pipeline.py" in m for m in members):
              sys.exit(f"{sdist} is missing the package source")

          print(f"{whl}: ok")
          print(f"{sdist}: ok")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # TestPyPI first, so the very first upload of a name is rehearsed somewhere
  # recoverable. PyPI filenames are immutable and a version cannot be re-used
  # even after deletion, so there is no second attempt at 2.1.0 on the real index.
  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write   # the OIDC token; this is what replaces an API token
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    # Named environment, so PyPI's publisher config can be scoped to it and a
    # required reviewer can be added on the GitHub side if you ever want the
    # upload to need a second pair of eyes.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
