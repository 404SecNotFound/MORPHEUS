name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Installed from the [dev] extra so the ruff and bandit versions are
      # pinned in pyproject.toml. Unpinned tools silently change the gate
      # whenever upstream adds or reclassifies a rule.
      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check morpheus_crypt/ tests/

      - name: Security scan with bandit
        run: bandit -r morpheus_crypt/ -ll -q

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # The tkinter clipboard fallback and the pbcopy/xclip backends are
          # platform-specific, so smoke-test the other two OSes on one version.
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # Editable install of the package plus the [dev] extra. This pulls in
      # hypothesis (required by tests/test_fuzz.py) and pytest-asyncio (without
      # which the asyncio_mode setting is ignored and the async tests do not
      # run), and it exercises the packaging metadata so build breakage is
      # caught here rather than at release time.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Required on Linux: without pqcrypto the 9 hybrid-PQ tests skip, which
      # moves the coverage total and would make the gate below flap.
      - name: Install post-quantum extra (Linux, required)
        if: runner.os == 'Linux'
        run: pip install -e ".[pq]"

      # Best-effort elsewhere: a pqcrypto build failure on macOS or Windows
      # should not mask real test failures.
      - name: Install post-quantum extra (other platforms, best-effort)
        if: runner.os != 'Linux'
        continue-on-error: true
        run: pip install -e ".[pq]"

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      # fail_under lives in [tool.coverage.report] in pyproject.toml, so this
      # step fails the build if coverage regresses.
      - name: Run tests with coverage
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: python -m pytest tests/ --cov --cov-report=term-missing

  # The known-answer vectors, run at every commit in the push rather than only
  # at its tip.
  #
  # d6e4374 is why. It changed one character of a v4 domain separator --
  # `morpheus-cmt-v4` to `-v5` -- swept in by a broad `git add` while other
  # edits were in flight, inside a commit titled "docs:". A checkout of that
  # commit fails its own vector tests, but CI only ever tested the tip of the
  # push, so nothing noticed until a reviewer checked the commit out by hand.
  #
  # The tip being clean is not enough for wire-format evidence specifically. A
  # broken intermediate commit is a commit someone can bisect to, build from, and
  # write a ciphertext with, and this repo has already published history once.
  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Needed to resolve the range; the default shallow clone has no
          # history to walk.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The editable install points at the working tree, so it follows each
      # checkout below without reinstalling per commit.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the vector tests at every commit in the range
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          TIP: ${{ github.sha }}
        run: |
          set -uo pipefail
          MAX=20
          ZERO=0000000000000000000000000000000000000000

          base="${PR_BASE:-${PUSH_BEFORE:-}}"

          # A new branch, a force-push, or a squashed base leaves `before`
          # pointing at something this clone cannot resolve. Degrade to the tip
          # rather than failing the job on a bookkeeping detail.
          if [ -z "$base" ] || [ "$base" = "$ZERO" ] \
             || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "::notice::no resolvable base ref; testing the tip commit only"
            commits="$TIP"
          else
            commits=$(git rev-list --reverse "${base}..${TIP}")
          fi

          total=$(printf '%s\n' "$commits" | grep -c . || true)
          if [ "$total" -eq 0 ]; then
            echo "::notice::range is empty; nothing to check"
            exit 0
          fi

          # Bounded, and says so. A silent top-N reads as "everything passed".
          if [ "$total" -gt "$MAX" ]; then
            echo "::warning::${total} commits in range; checking the newest ${MAX}. Not checked: $((total - MAX))"
            commits=$(printf '%s\n' "$commits" | tail -n "$MAX")
          fi

          # Read from a file rather than iterating an unquoted variable. Word
          # splitting on the SHA list is shell-dependent, and a pipe would put
          # the loop in a subshell where `failed` does not survive it.
          printf '%s\n' "$commits" > "${RUNNER_TEMP}/commits.txt"

          failed=""
          while IFS= read -r sha; do
            [ -n "$sha" ] || continue

            # Checked, not assumed. An unchecked failure here leaves the tree at
            # the previous commit and the vectors then pass *for that tree* while
            # the log claims the commit under test was fine -- a green tick for a
            # commit that was never actually built.
            if ! git checkout --quiet --detach "$sha"; then
              echo "::error::cannot check out ${sha}"
              failed="${failed} ${sha}"
              continue
            fi

            if [ ! -f tests/test_vectors.py ]; then
              echo "::notice::${sha} predates tests/test_vectors.py; skipped"
              continue
            fi

            echo "::group::vectors @ ${sha}"
            if python -m pytest tests/test_vectors.py -q; then
              echo "ok ${sha}"
            else
              echo "::error::vector tests fail at ${sha}"
              failed="${failed} ${sha}"
            fi
            echo "::endgroup::"
          done < "${RUNNER_TEMP}/commits.txt"

          git checkout --quiet --detach "$TIP"

          if [ -n "$failed" ]; then
            echo "the wire format is broken at:${failed}"
            exit 1
          fi
          echo "wire format intact at every checked commit"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # Guards the PEP 561 marker, which older setuptools silently drops.
      - name: Verify wheel contents
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          required = [
              "morpheus_crypt/py.typed",
              "morpheus_crypt/ui/app.py",
              "morpheus_crypt/ui/steps/input.py",
              "morpheus_crypt/core/pipeline.py",
          ]
          missing = [r for r in required if not any(r in n for n in names)]
          if missing:
              sys.exit(f"missing from {whl}: {missing}")
          print(f"{whl}: all required files present")
          PY

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # This is a cryptographic tool; a vulnerable dependency is a release
      # blocker, so the pinned set is audited on every run.
      - name: Audit pinned dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -r requirements-lock.txt
          pip-audit
