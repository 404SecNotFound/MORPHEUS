[build-system]
# 77+ is required so `py.typed` is reliably included in the wheel and so the
# PEP 639 license expression below is understood. At the previous floor (68.0)
# the PEP 561 marker was silently dropped from the built distribution.
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
# The distribution is `morpheus-crypt` and the import package is
# `morpheus_crypt`; the *command* stays `morpheus` (see [project.scripts]).
#
# Both had to move, not just the distribution. `morpheus` on PyPI is an
# unrelated abandoned package, and it also ships a top-level `morpheus` import
# package -- so keeping this directory as `morpheus/` left a silent
# site-packages overwrite path, whichever installed second winning, inside a
# cryptography tool's trust boundary. Renaming only the distribution was
# considered and rejected for exactly that reason.
name = "morpheus-crypt"
version = "2.2.0"
description = "Quantum-resistant multi-cipher encryption tool with a terminal GUI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "cryptography>=44.0.0",
    "argon2-cffi>=25.1.0",
    "textual>=1.0.0",
    "pyperclip>=1.9.0",
]

[project.optional-dependencies]
pq = ["pqcrypto>=0.4.0"]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.4.0",
    "hypothesis>=6.163.0",
    "ruff==0.16.1",
    "bandit==1.9.4",
]

[project.scripts]
# The command the user types is unchanged by the rename.
morpheus = "morpheus_crypt.__main__:main"

[tool.setuptools.packages.find]
# `morpheus_crypt*`, not `morpheus*`. The wider glob would also match a
# top-level `morpheus.py` in the project root -- which exists as the
# `python morpheus.py` launcher -- and ship it as a module that shadows nothing
# but confuses `import morpheus` for anyone who also has the PyPI package.
include = ["morpheus_crypt*"]

[tool.setuptools.package-data]
# Without this the PEP 561 marker is dropped by older setuptools, so consumers
# silently lose type information.
morpheus_crypt = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["slow: marks tests as slow (production KDF params)"]

[tool.coverage.run]
source = ["morpheus_crypt"]
omit = [
    "morpheus_crypt/gui.py",
    "morpheus_crypt/__main__.py",
]

[tool.coverage.report]
# Set just below the current measured figure (~75%) so regressions fail the
# build without the gate tripping on rounding. Ratchet this upward as TUI
# coverage improves; do not lower it.
fail_under = 74

[tool.ruff]
# Pinned explicitly so CI results do not drift when ruff changes its defaults.
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Correctness and consistency live here. Security scanning is bandit's job
# (see the lint job in CI), so the S ruleset is deliberately not selected:
# it would flag all 366 `assert` statements in the test suite.
select = ["E", "W", "F", "I", "B", "C4"]
ignore = [
    # Long lines are common in the docstrings and help text; not worth churn.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# `assert False` is idiomatic in these tests for unreachable branches.
"tests/*" = ["B011"]
