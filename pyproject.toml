[build-system]
# 77+ is required so `py.typed` is reliably included in the wheel and so the
# PEP 639 license expression below is understood. At the previous floor (68.0)
# the PEP 561 marker was silently dropped from the built distribution.
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "morpheus"
version = "2.1.0"
description = "Quantum-resistant multi-cipher encryption tool with a terminal GUI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "cryptography>=44.0.0",
    "argon2-cffi>=25.1.0",
    "textual>=1.0.0",
    "pyperclip>=1.9.0",
]

[project.optional-dependencies]
pq = ["pqcrypto>=0.4.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.21",
    "hypothesis>=6.0",
    "ruff==0.16.0",
    "bandit==1.9.4",
]

[project.scripts]
morpheus = "morpheus.__main__:main"

[tool.setuptools.packages.find]
include = ["morpheus*"]

[tool.setuptools.package-data]
# Without this the PEP 561 marker is dropped by older setuptools, so consumers
# silently lose type information.
morpheus = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["slow: marks tests as slow (production KDF params)"]

[tool.coverage.run]
source = ["morpheus"]
omit = [
    "morpheus/gui.py",
    "morpheus/__main__.py",
]

[tool.coverage.report]
# Set just below the current measured figure (~75%) so regressions fail the
# build without the gate tripping on rounding. Ratchet this upward as TUI
# coverage improves; do not lower it.
fail_under = 74

[tool.ruff]
# Pinned explicitly so CI results do not drift when ruff changes its defaults.
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Correctness and consistency live here. Security scanning is bandit's job
# (see the lint job in CI), so the S ruleset is deliberately not selected:
# it would flag all 366 `assert` statements in the test suite.
select = ["E", "W", "F", "I", "B", "C4"]
ignore = [
    # Long lines are common in the docstrings and help text; not worth churn.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# `assert False` is idiomatic in these tests for unreachable branches.
"tests/*" = ["B011"]
